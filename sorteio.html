<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sorteio — GED NEXO Varginha</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#05080F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05080F; --blue-300:#93C5FD; --blue-400:#60A5FA; --blue-500:#3B82F6;
  --ink:#E9EEF8; --mute:rgba(233,238,248,.55);
  --grad:linear-gradient(135deg,#93C5FD 0%,#60A5FA 30%,#3B82F6 62%,#6366F1 100%);
  --disp:"Space Grotesk",system-ui,sans-serif;
  --sans:"Inter",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  display:grid;place-items:center;text-align:center;-webkit-font-smoothing:antialiased}

.bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(1200px 820px at 15% -10%,#17315C 0%,transparent 60%),
  radial-gradient(1000px 700px at 88% 6%,#122747 0%,transparent 58%),
  radial-gradient(900px 900px at 50% 115%,#0D1C38 0%,transparent 62%)}
.orb{position:fixed;border-radius:50%;filter:blur(100px);opacity:.42;z-index:0;pointer-events:none}
.o1{width:52vw;height:52vw;top:-16%;left:-12%;background:radial-gradient(circle,rgba(59,130,246,.55),transparent 68%);
  animation:fl 22s ease-in-out infinite}
.o2{width:44vw;height:44vw;bottom:-18%;right:-12%;background:radial-gradient(circle,rgba(99,102,241,.5),transparent 68%);
  animation:fl 28s ease-in-out infinite reverse}
@keyframes fl{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(5%,6%) scale(1.12)}}

.palco{position:relative;z-index:1;width:min(1100px,92vw);padding:2rem}
.marca{display:flex;align-items:center;gap:.8rem;justify-content:center;margin-bottom:clamp(1.5rem,5vh,3rem)}
.marca svg{width:clamp(34px,4vw,52px);height:clamp(34px,4vw,52px);color:var(--blue-400)}
.marca .t1{font-family:var(--disp);font-size:clamp(1.1rem,2.4vw,1.7rem);font-weight:700;letter-spacing:.06em;display:block;line-height:1.1}
.marca .t2{font-size:clamp(.5rem,1vw,.68rem);letter-spacing:.38em;color:var(--blue-400);font-weight:700;display:block;margin-top:.3rem}

.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}

.cena{display:none}
.cena.on{display:block;animation:entra .5s cubic-bezier(.2,.9,.3,1)}
@keyframes entra{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* espera */
.rotulo{font-size:clamp(.7rem,1.5vw,1rem);letter-spacing:.34em;text-transform:uppercase;
  color:var(--blue-300);font-weight:700;margin-bottom:1.2rem}
.espera h1{font-family:var(--disp);font-size:clamp(2.2rem,7vw,5rem);letter-spacing:-.03em;margin:0;line-height:1.05}
.espera p{color:var(--mute);font-size:clamp(.95rem,2vw,1.3rem);margin:1.4rem 0 0}
.ponto{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--blue-400);
  margin:0 5px;animation:pula 1.3s infinite}
.ponto:nth-child(2){animation-delay:.18s}
.ponto:nth-child(3){animation-delay:.36s}
@keyframes pula{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-12px);opacity:1}}

/* contagem */
.num{font-family:var(--disp);font-size:clamp(7rem,30vw,22rem);font-weight:700;line-height:.9;
  letter-spacing:-.05em;font-variant-numeric:tabular-nums}
.num.bate{animation:bate .9s cubic-bezier(.2,.9,.3,1)}
@keyframes bate{0%{transform:scale(1.5);opacity:0}45%{transform:scale(1);opacity:1}100%{transform:scale(1)}}
.embaralha{font-family:var(--disp);font-size:clamp(1.3rem,4.4vw,3rem);font-weight:700;color:var(--mute);
  margin-top:1.2rem;height:1.3em;overflow:hidden;letter-spacing:-.02em}

/* vencedor */
.venceu .rotulo{color:#6EE7B7}
.nome{font-family:var(--disp);font-size:clamp(2.4rem,9vw,7rem);font-weight:700;letter-spacing:-.04em;
  line-height:1.02;margin:.4rem 0 0;word-break:break-word}
.empresa{font-size:clamp(1.1rem,3vw,2rem);color:var(--blue-300);margin-top:1.1rem;font-weight:600}
.brilho{position:absolute;inset:0;pointer-events:none;z-index:-1;
  background:radial-gradient(circle at 50% 45%,rgba(59,130,246,.3),transparent 62%);
  animation:pulsa 2.6s ease-in-out infinite}
@keyframes pulsa{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}

.confete{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.cf{position:absolute;width:11px;height:16px;opacity:0;border-radius:2px;animation:cai linear forwards}
@keyframes cai{
  0%{opacity:1;transform:translateY(-12vh) rotate(0deg)}
  100%{opacity:.15;transform:translateY(112vh) rotate(760deg)}
}

.rodape{position:fixed;left:0;right:0;bottom:1.1rem;z-index:1;text-align:center;
  font-size:.74rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(233,238,248,.3);font-weight:700}
.off{position:fixed;top:1rem;right:1.2rem;z-index:3;font-size:.72rem;font-weight:700;
  padding:.4rem .85rem;border-radius:999px;background:rgba(248,113,113,.16);
  border:1px solid rgba(248,113,113,.4);color:#FCA5A5;display:none}
.off.on{display:block}
@media (prefers-reduced-motion:reduce){.orb,.ponto,.brilho,.num.bate{animation:none}}
</style>
</head>
<body>
<div class="bg"></div><div class="orb o1"></div><div class="orb o2"></div>
<div class="confete" id="confete"></div>
<div class="off" id="off">sem conexão</div>

<div class="palco">
  <div class="marca">
    <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
      <path d="M14 10h8a8 8 0 0 1 0 16h-8a8 8 0 0 1 0-16Z" stroke="currentColor" stroke-width="3.4"/>
      <path d="M26 22h8a8 8 0 0 1 0 16h-8a8 8 0 0 1 0-16Z" stroke="currentColor" stroke-width="3.4"/>
    </svg>
    <span><span class="t1">GED<span style="color:var(--blue-400);margin:0 .18em">|</span>NEXO</span><span class="t2">VARGINHA</span></span>
  </div>

  <section class="cena on" id="c-espera">
    <div class="rotulo">Sorteio</div>
    <h1 class="grad">Prepare-se</h1>
    <p>O sorteio começa já<span class="ponto"></span><span class="ponto"></span><span class="ponto"></span></p>
  </section>

  <section class="cena" id="c-conta">
    <div class="rotulo">Sorteando entre os presentes</div>
    <div class="num grad" id="num">—</div>
    <div class="embaralha" id="embaralha"></div>
  </section>

  <section class="cena venceu" id="c-venceu" style="position:relative">
    <div class="brilho"></div>
    <div class="rotulo">O ganhador é</div>
    <div class="nome grad" id="vNome">—</div>
    <div class="empresa" id="vEmpresa"></div>
  </section>
</div>

<div class="rodape">Premiação &amp; Reconhecimento de Empresas Regionais</div>

<script>
(function(){
  "use strict";
  var SB = {
    url: "https://divopnirxrjtvbwwrqgu.supabase.co",
    key: "sb_publishable_3PcXXLW5N-eWFJFFG-2xrw_PqhOV4ro"
  };
  var $ = function(s){ return document.querySelector(s); };

  var rodadaVista = -1, estadoVisto = "", revelaEm = 0, timerNum = null, timerEmb = null;
  var nomes = ["Conferindo a lista…","Embaralhando…","Quase lá…","Sorteando…","Tambores…"];

  function cena(id){
    ["c-espera","c-conta","c-venceu"].forEach(function(c){
      document.getElementById(c).classList.toggle("on", c === id);
    });
  }

  function pararTimers(){
    if(timerNum){ clearInterval(timerNum); timerNum = null; }
    if(timerEmb){ clearInterval(timerEmb); timerEmb = null; }
  }

  function contagem(){
    cena("c-conta");
    pararTimers();
    var i = 0;
    timerEmb = setInterval(function(){
      $("#embaralha").textContent = nomes[i++ % nomes.length];
    }, 1100);
    $("#embaralha").textContent = nomes[0];

    function tick(){
      var falta = Math.ceil((revelaEm - Date.now())/1000);
      if(falta < 0) falta = 0;
      var el = $("#num");
      if(el.textContent !== String(falta)){
        el.textContent = falta;
        el.classList.remove("bate"); void el.offsetWidth; el.classList.add("bate");
      }
    }
    tick();
    timerNum = setInterval(tick, 200);
  }

  function confete(){
    var box = $("#confete");
    var cores = ["#60A5FA","#93C5FD","#6366F1","#34D399","#FBBF24","#F472B6"];
    for(var i = 0; i < 90; i++){
      var d = document.createElement("i");
      d.className = "cf";
      d.style.left = (Math.random()*100) + "vw";
      d.style.background = cores[Math.floor(Math.random()*cores.length)];
      d.style.animationDuration = (2.6 + Math.random()*2.4) + "s";
      d.style.animationDelay = (Math.random()*0.7) + "s";
      box.appendChild(d);
      (function(el){ setTimeout(function(){ el.remove(); }, 6000); })(d);
    }
  }

  function revelar(nome, empresa){
    pararTimers();
    $("#vNome").textContent = nome || "—";
    $("#vEmpresa").textContent = empresa || "";
    cena("c-venceu");
    confete();
  }

  function aplicar(s){
    if(!s){ return; }
    var mudou = (s.rodada !== rodadaVista) || (s.estado !== estadoVisto);
    rodadaVista = s.rodada; estadoVisto = s.estado;
    revelaEm = s.revela_em ? new Date(s.revela_em).getTime() : 0;

    if(s.estado === "parado"){
      if(mudou){ pararTimers(); cena("c-espera"); }
      return;
    }
    if(s.estado === "contando"){
      if(Date.now() >= revelaEm){ revelar(s.vencedor_nome, s.vencedor_empresa); return; }
      if(mudou || !timerNum) contagem();
      // revela sozinho quando o tempo acabar, sem esperar a próxima consulta
      setTimeout(function(){
        if(estadoVisto === "contando" && Date.now() >= revelaEm - 50)
          revelar(s.vencedor_nome, s.vencedor_empresa);
      }, Math.max(0, revelaEm - Date.now()));
      return;
    }
    if(s.estado === "revelado" && mudou){
      revelar(s.vencedor_nome, s.vencedor_empresa);
    }
  }

  function consultar(){
    fetch(SB.url + "/rest/v1/sorteio?select=*&id=eq.1", {
      headers: { apikey: SB.key, Authorization: "Bearer " + SB.key },
      cache: "no-store"
    })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      $("#off").classList.remove("on");
      if(j && j[0]) aplicar(j[0]);
    })
    .catch(function(){ $("#off").classList.add("on"); });
  }

  consultar();
  setInterval(consultar, 1000);

  // mantém a tela acesa no projetor, se o navegador permitir
  try{
    if("wakeLock" in navigator){
      var trava = null;
      var pedir = function(){ navigator.wakeLock.request("screen").then(function(w){ trava = w; }).catch(function(){}); };
      pedir();
      document.addEventListener("visibilitychange", function(){ if(!document.hidden) pedir(); });
    }
  }catch(e){}
})();
</script>
</body>
</html>
